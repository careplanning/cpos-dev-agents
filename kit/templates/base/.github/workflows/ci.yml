# cpos-kit が所有する (update で置き換わる)。
# 手順の正本は cpos-kit の kit/ci/standard.json。CPOS の他のアプリと同じ標準 CI に、kit の検査 (validate) を足したもの。
# CPOS の Cloud Build の CI に移ったリポジトリ (変数 EXTERNAL_CI_ACTIVE=true) では、同じ手順をそちらが走らせるので、ここは動かない。
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    if: vars.EXTERNAL_CI_ACTIVE != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install
        run: npm ci --no-audit --no-fund
      - run: npx cpos-kit validate
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level="high"
      - name: SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cyclonedx.json
      - name: Typecheck
        run: npm run typecheck --if-present
      - name: Test
        run: npm run test --if-present
      - name: Build
        run: npm run build --if-present
